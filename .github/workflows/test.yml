name: Portal validation
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_MODE: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test
      - run: python scripts/verify_backup.py
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fictional
          POSTGRES_USER: fictional
          POSTGRES_PASSWORD: fictional-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fictional -d fictional"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APP_MODE: development
      DATABASE_URL: postgresql://fictional:fictional-ci-only@127.0.0.1:5432/fictional?sslmode=disable
      DATABASE_PERSISTENCE_CONFIRMED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python manage.py test portal.test_postgres_storage portal.test_reviewed_materials portal.test_case_list
