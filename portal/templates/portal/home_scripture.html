<section class="home-scripture" aria-label="베드로전서 5장 3절과 페이지 취지">
<figure>
<blockquote><span>“맡은 자들에게 주장하는 자세를 하지 말고</span><strong>양 무리의 본이 되라”</strong></blockquote>
<figcaption><cite>베드로전서 5장 3절 · 개역개정</cite></figcaption>
</figure>
<div class="scripture-purpose">
<p>교회의 권한은 <strong>성도를 섬기는 책임</strong>과 함께 주어집니다.</p>
<p>우리는 신성교회에서 이루어진 결정과 그 과정이 이 말씀에 부합했는지, <strong>사건 기록과 근거 자료</strong>를 통해 함께 살펴보고자 합니다.</p>
<p>이 기준은 장로와 목사를 비롯한 <strong>모든 교회 지도자에게 동일하게 적용됩니다.</strong></p>
</div>
<p class="scripture-action"><a class="button" href="#timeline">사건 타임라인 보기</a></p>
