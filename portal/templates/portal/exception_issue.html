{% extends 'portal/base.html' %}{% block content %}<div class="narrow"><h1>신원 확인 예외 발급</h1><p class="error">{{ error }}</p><form method="post">{% csrf_token %}<label>활성 교인 내부 ID<input name="member" required></label><label>확인 방법·발급 사유 (불필요한 개인정보 제외)<textarea name="reason" required></textarea></label><label><input type="checkbox" name="confirmed" value="yes" required> 개인의 신원을 별도로 확인했습니다.</label><p><button>15분 일회성 접속 수단 발급</button></p></form>{% if token %}<p class="notice">이 화면에 한 번만 표시됩니다. 해당 개인에게 안전하게 전달하세요.</p><textarea readonly>{{ token }}</textarea>{% endif %}</div>{% endblock %}
