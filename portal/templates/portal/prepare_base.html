<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>{% block title %}준비위원 검토실{% endblock %}</title>
<style>
:root{--ink:#243b36;--muted:#596d66;--accent:#285e4c;--line:#d9e3dc;--paper:#fff;--bg:#f3f5f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.8 system-ui,-apple-system,"Noto Sans KR",sans-serif}a{color:var(--accent);text-underline-offset:4px}header{background:var(--paper);border-bottom:1px solid var(--line);padding:20px 4vw;display:flex;justify-content:space-between;align-items:center;gap:20px}header strong{font-size:21px}.eyebrow,.muted{color:var(--muted);font-size:14px}header p{margin:0}main{max-width:1600px;margin:36px auto;padding:0 4vw}h1{font-size:32px;line-height:1.4;letter-spacing:-.04em}h2{font-size:22px;line-height:1.5}h3{font-size:18px;margin:0 0 12px}.lead{max-width:900px}.notice{padding:18px 22px;border-left:4px solid #a38a50;background:#f1ecdf}.panel{padding:26px;background:var(--paper);border:1px solid var(--line);border-radius:12px;margin:22px 0}.narrow{max-width:580px;margin:60px auto}.toolbar{display:flex;align-items:end;flex-wrap:wrap;gap:14px}.toolbar label:first-of-type{flex:1;min-width:220px}label{display:block;margin-top:14px;font-weight:600}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:10px 12px;border:1px solid #96a99e;border-radius:6px;background:white}textarea{min-height:160px}button,.button{border:0;background:var(--accent);color:white;border-radius:6px;padding:10px 18px;cursor:pointer;text-decoration:none;display:inline-block}button.secondary{background:#e9eeea;color:var(--ink)}input:focus,textarea:focus,select:focus,button:focus,a:focus{outline:3px solid #b29250;outline-offset:3px}.inline{display:inline}.inline button{padding:6px 14px}.stats{display:flex;gap:14px;flex-wrap:wrap;margin:22px 0}.stat{background:white;border:1px solid var(--line);border-radius:8px;padding:12px 24px}.stat strong{font-size:26px;margin-right:8px}.table-scroll{overflow:auto;max-height:74vh;border:1px solid var(--line);background:white;border-radius:10px}table{border-collapse:separate;border-spacing:0;width:100%;min-width:2400px;font-size:15px}th,td{vertical-align:top;text-align:left;padding:20px;min-width:280px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}th{position:sticky;top:0;background:#e8eee8;z-index:2;font-size:16px}th:first-child,td:first-child{position:sticky;left:0;min-width:260px;max-width:300px;background:#f8faf6;z-index:1}th:first-child{z-index:3;background:#e8eee8}td p{margin:0 0 12px}.text{white-space:pre-line;overflow-wrap:anywhere}.status{display:inline-block;font-size:13px;background:#e6eee8;padding:2px 10px;border-radius:20px;margin:6px 0}.source{font-size:13px;color:var(--muted);overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.grid .panel{margin:0}.spaced{margin:28px 0}.comment{padding:24px 0;border-bottom:1px solid var(--line)}.comment h3{margin-bottom:4px}.errorlist{color:#9a2929;padding-left:22px}.pager{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:24px 0}.original{border-top:4px solid #7f9383}.working{border-top:4px solid #b59b60}details>summary{cursor:pointer;color:var(--accent)}footer{max-width:1600px;margin:40px auto;padding:24px 4vw;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}@media(max-width:760px){main{padding:0 18px;margin-top:24px}header{padding:18px}header strong{font-size:18px}h1{font-size:26px}.grid{grid-template-columns:1fr}.panel{padding:20px}.narrow{margin-top:30px}.table-scroll{max-height:70vh}td,th{padding:16px}.stats{gap:8px}.stat{padding:8px 15px}.toolbar{align-items:stretch}.toolbar label{width:100%}}
</style></head><body><header><div><strong>준비위원 검토실</strong><p class="eyebrow">72개 사건 · 주장과 증거 대조</p></div>{% if prepare_logged_in %}<form class="inline" action="{% url 'prepare_logout' %}" method="post">{% csrf_token %}<button class="secondary">검토실 로그아웃</button></form>{% endif %}</header><main>{% block content %}{% endblock %}</main><footer>내부 검토용 자료입니다. 기존 사건 본문과 ⑤ 우리의 의견은 보존하며, 이곳의 의견은 기존 웹페이지에 자동 반영되지 않습니다.</footer></body></html>
