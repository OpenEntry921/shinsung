{% extends 'portal/base.html' %}
{% block title %}문자 인증번호 입력{% endblock %}
{% block content %}
<section class="narrow panel">
  <h1>문자 인증번호 입력</h1>
  <p>문자를 받으셨다면 5분 안에 인증번호를 입력해 주세요. 문자가 오지 않거나 공유 번호·번호 변경의 경우 운영 관리자에게 문의해 주세요.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label>문자 인증번호<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label>
    <p><button type="submit">인증하고 게시판 열기</button></p>
  </form>
  <p><a href="{% url 'board_login' %}">이름과 번호를 다시 입력해 요청</a></p>
</section>
{% endblock %}
