{% extends 'base.html' %}{% block page %}member{% endblock %}{% block content %}<section class="heading"><p class="eyebrow">교인 전용 · <span id="identity"></span></p><h1>같은 기록을 함께 읽습니다</h1><p>사실, 주장, 검토 의견과 공식 판단을 구분해 확인하세요.</p></section><div class="tabs" role="navigation"><button data-view="cases-view">사건 열람</button><button data-view="board-view">실명 게시판</button><button data-view="requests-view">자료 제출·정정</button><button data-view="changes-view">게시·정정 이력</button></div><section id="cases-view"><form id="case-search" class="filters"><label>제목·주제<input name="q" type="search"></label><label>시작일<input name="start" type="date"></label><label>종료일<input name="end" type="date"></label><button>검색</button></form><div id="case-list" class="list"></div><div id="case-detail"></div></section><section id="board-view" hidden><div class="section-top"><h2>실명 게시판</h2><button id="my-posts" class="quiet">내 글·관리 조치 확인</button><button id="new-post">글 작성</button></div><form id="post-search" class="filters"><label>제목·내용<input name="q" type="search"></label><button>검색</button></form><div id="post-list" class="list"></div><article id="post-detail"></article><form id="post-form" class="panel" hidden><h3 id="post-form-title">글 작성</h3><input name="id" type="hidden"><input name="expected_updated" type="hidden"><label>제목<input name="title" maxlength="200" required></label><label>관련 사건<select name="case_id" id="post-case"><option value="">선택하지 않음</option></select></label><label>내용<textarea name="body" maxlength="20000" rows="10" required></textarea></label><label class="check"><input name="real_name_notice" type="checkbox" required>교인 전용 게시판에 등록된 실명으로 표시됩니다.</label><button>저장</button><button type="button" id="cancel-post" class="quiet">취소</button></form></section><section id="requests-view" hidden><h2>비공개 자료 제출·정정 요청</h2><p>운영 담당자에게만 전달됩니다. 파일은 게시판에 첨부하지 않습니다. 원본 제출은 운영자에게 별도로 문의하세요.</p><form id="request-form" class="panel"><label>요청 종류<select name="kind"><option value="correction">정정 요청</option><option value="evidence">자료 제출</option><option value="report">게시글 신고</option><option value="appeal">관리 조치 이의 제기</option></select></label><label>관련 사건·게시글 식별번호<input name="target" maxlength="100"></label><label>내용<textarea name="body" rows="6" required maxlength="20000"></textarea></label><button>비공개로 제출</button></form><h3>내 요청과 처리 답변</h3><div id="own-requests"></div></section><section id="changes-view" hidden><h2>게시·정정 이력</h2><div id="changes"></div></section>{% endblock %}
